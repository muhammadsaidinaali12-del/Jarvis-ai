# Project-wide Gradle settings

# JVM
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Gradle performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=4

# Kotlin
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process

# Android
android.nonTransitiveRClass=true

# IMPORTANT:
# AGP 9.1.1 uses built-in Kotlin.
# Do NOT set android.builtInKotlin=false.

# KSP generates sources into the Kotlin source set.
# AGP 9.x otherwise rejects this configuration.
android.disallowKotlinSourceSets=false

# Google Services
googleServices.missingGoogleServicesStrategy=warn